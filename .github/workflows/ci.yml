name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module files
        run: go mod tidy -diff

      - name: Verify generated brand copy
        run: go run ./scripts/sync-brand.go --check

      - name: Test shell installer
        run: |
          sh -n ./scripts/verify-public-release.sh
          ./scripts/test-install.sh
          ./scripts/test-public-release.sh

      - name: go vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

      - name: Test (네트워크 불필요 — testdata/픽스처)
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Verify release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      # A full release cross-builds three command identities for six targets.
      # PRs only need the runner target; release.yml performs the complete matrix
      # before publishing any tag.
      - name: Build release binaries for CI target
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target

      - name: Verify current and compatibility binaries
        shell: bash
        run: |
          set -euo pipefail
          oddsock_bin="$(find dist -type f -name oddsock -print -quit)"
          opendatactl_bin="$(find dist -type f -name opendatactl -print -quit)"
          gongctl_bin="$(find dist -type f -name gongctl -print -quit)"
          test -n "$oddsock_bin" -a -n "$opendatactl_bin" -a -n "$gongctl_bin"
          "$oddsock_bin" version | grep -q '^oddsock '
          "$opendatactl_bin" version | grep -q '^opendatactl '
          "$gongctl_bin" version | grep -q '^gongctl '
          "$oddsock_bin" --help | grep -q '^  oddsock '
          "$opendatactl_bin" --help | grep -q '^  opendatactl '
          "$gongctl_bin" --help | grep -q '^  gongctl '

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test Windows build and config migration
        # The only short-skipped test launches a real browser. The Linux job
        # keeps that regression coverage; this job is for Windows build/config
        # portability and must not depend on hosted-runner Edge startup timing.
        run: go test -short ./...

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Test PowerShell installer
        shell: pwsh
        run: ./scripts/test-install.ps1
