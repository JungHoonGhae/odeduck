name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module files
        run: go mod tidy -diff

      - name: Verify generated brand copy
        run: go run ./scripts/sync-brand.go --check

      - name: go vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Test (네트워크 불필요 — testdata/픽스처)
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Create snapshot-only catalogue fixture
        shell: bash
        run: |
          mkdir -p release-assets
          printf '%s' '{"syncedAt":"2026-09-01T00:00:00Z","type":"ALL","source":"official","entries":[{"pk":"15000001","title":"CI packaging fixture","svcType":"FILE","dataTypes":["FILE"]}]}' \
            | gzip -n -9 > release-assets/oddsock-catalog.json.gz

      - name: Verify release packaging
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Verify current and compatibility binaries
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name 'oddsock_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$archive"
          archive_entries="$(tar -tzf "$archive")"
          grep -qx 'oddsock' <<<"$archive_entries"
          grep -qx 'opendatactl' <<<"$archive_entries"
          grep -qx 'gongctl' <<<"$archive_entries"

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          "$extract_dir/oddsock" version | grep -q '^oddsock '
          "$extract_dir/opendatactl" version | grep -q '^opendatactl '
          "$extract_dir/gongctl" version | grep -q '^gongctl '
          "$extract_dir/oddsock" --help | grep -q '^  oddsock '
          "$extract_dir/opendatactl" --help | grep -q '^  opendatactl '
          "$extract_dir/gongctl" --help | grep -q '^  gongctl '

          former_archive="$(find dist -maxdepth 1 -name 'opendatactl_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$former_archive"
          former_entries="$(tar -tzf "$former_archive")"
          grep -qx 'opendatactl' <<<"$former_entries"
          grep -qx 'gongctl' <<<"$former_entries"

          oldest_archive="$(find dist -maxdepth 1 -name 'gongctl_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$oldest_archive"
          oldest_entries="$(tar -tzf "$oldest_archive")"
          grep -qx 'gongctl' <<<"$oldest_entries"

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test Windows build and config migration
        run: go test ./...

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
