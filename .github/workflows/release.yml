name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog 생성에 전체 히스토리 필요
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify renamed release targets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "JungHoonGhae/odeduck"

      - name: Verify module files
        run: go mod tidy -diff

      - name: Verify release tree
        run: |
          go run ./scripts/sync-brand.go --check
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go test ./...
          go build ./...

      - name: Build official prebuilt catalogue
        shell: bash
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/odeduck-release-config
        run: |
          set -euo pipefail
          go run ./cmd/odeduck catalog sync --source official-file+web --type ALL --per-page 1000 --delay 100ms
          catalog_file="$XDG_CONFIG_HOME/odeduck/catalog.json"
          jq '{
            source, type, total: (.entries | length),
            api: ([.entries[] | select((.dataTypes // []) | index("API"))] | length),
            file: ([.entries[] | select((.dataTypes // []) | index("FILE"))] | length),
            dual: ([.entries[] | select(((.dataTypes // []) | index("API")) and ((.dataTypes // []) | index("FILE")))] | length),
            rest: ([.entries[] | select(.svcType == "REST")] | length),
            link: ([.entries[] | select(.svcType == "LINK")] | length),
            unknown: ([.entries[] | select((.svcType // "") == "")] | length),
            officialContracts: ([.entries[] | select(.officialApi != null)] | length)
          }' "$catalog_file" | tee "$RUNNER_TEMP/catalog-coverage.json"
          test "$(jq '
            .source == "official-file+web" and .type == "ALL" and
            .total > 90000 and .api > 11000 and .file > 80000 and
            .dual > 50000 and
            .rest > 6000 and .link > 3500 and .unknown < 500 and
            .officialContracts > 11000
          ' "$RUNNER_TEMP/catalog-coverage.json")" = true
          go run ./cmd/odeduck catalog validate-release --format json \
            | tee "$RUNNER_TEMP/catalog-search-quality.json"
          test "$(jq '.passed and ([.cases[].passed] | all)' "$RUNNER_TEMP/catalog-search-quality.json")" = true
          mkdir -p release-assets
          gzip -n -9 -c "$catalog_file" > release-assets/odeduck-catalog.json.gz

      # CHANGELOG.md 의 해당 버전 섹션을 릴리즈 노트로 사용 (없으면 커밋 로그 폴백).
      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
