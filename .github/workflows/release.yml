name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      catalog_source_tag:
        description: "Optional published catalogue/app tag to reuse (empty selects latest catalogue)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog 생성에 전체 히스토리 필요
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify renamed release targets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "JungHoonGhae/odeduck"

      - name: Verify module files
        run: go mod tidy -diff

      - name: Verify release tree
        run: |
          go run ./scripts/sync-brand.go --check
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go test ./...
          go build ./...

      - name: Reuse and verify published catalogue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_SOURCE_TAG: ${{ inputs.catalog_source_tag }}
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/odeduck-catalog" ./cmd/odeduck
          sh scripts/prepare-release-catalog.sh "$RUNNER_TEMP/odeduck-catalog" release-assets "$CATALOG_SOURCE_TAG"
          jq . release-assets/catalog-source.json >> "$GITHUB_STEP_SUMMARY"

      # CHANGELOG.md 의 해당 버전 섹션을 릴리즈 노트로 사용 (없으면 커밋 로그 폴백).
      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
