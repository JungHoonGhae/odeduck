# GoReleaser config — OpenDataCTL과 한시적 gongctl 호환 바이너리용.
# 태그 푸시(vX.Y.Z) 시 GitHub Actions(release.yml)가 실행 → 크로스플랫폼 바이너리 +
# 체크섬 + private GitHub Release를 생성한다. 인증된 설치 스크립트가 asset을 받는다.
version: 2

project_name: opendatactl

before:
  hooks:
    - go mod tidy

builds:
  - id: opendatactl
    main: ./cmd/opendatactl
    binary: opendatactl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/JungHoonGhae/opendatactl/internal/version.CommandName=opendatactl
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Version={{ .Version }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Date={{ .Date }}
  - id: gongctl-compat
    main: ./cmd/opendatactl
    binary: gongctl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/JungHoonGhae/opendatactl/internal/version.CommandName=gongctl
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Version={{ .Version }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Date={{ .Date }}

archives:
  - id: opendatactl
    ids: [opendatactl, gongctl-compat]
    name_template: "opendatactl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
  # Keep the old asset name for saved v0.8 macOS/Linux installers and explicitly
  # version-pinned Windows installers. Unpinned v0.8 Windows installers cannot
  # follow GitHub's intermediate repository-rename redirect; README documents
  # rerunning the current installer for that one migration case.
  - id: gongctl
    ids: [gongctl-compat]
    name_template: "gongctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge "

release:
  draft: false
  prerelease: auto
