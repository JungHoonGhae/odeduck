# GoReleaser config — OpenDataCTL과 한시적 gongctl 호환 바이너리용.
# 태그 푸시(vX.Y.Z) 시 GitHub Actions(release.yml)가 실행 → 크로스플랫폼 바이너리 +
# 체크섬 + GitHub Release + Homebrew formula(tap 저장소 푸시)를 한 번에 생성.
version: 2

project_name: opendatactl

before:
  hooks:
    - go mod tidy

builds:
  - id: opendatactl
    main: ./cmd/opendatactl
    binary: opendatactl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/JungHoonGhae/opendatactl/internal/version.CommandName=opendatactl
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Version={{ .Version }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Date={{ .Date }}
  - id: gongctl-compat
    main: ./cmd/opendatactl
    binary: gongctl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/JungHoonGhae/opendatactl/internal/version.CommandName=gongctl
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Version={{ .Version }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/JungHoonGhae/opendatactl/internal/version.Date={{ .Date }}

archives:
  - id: opendatactl
    ids: [opendatactl, gongctl-compat]
    name_template: "opendatactl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
  # Keep the old asset name for users running a saved v0.8 installer. The new
  # installer prefers the OpenDataCTL archive, while this one contains only the
  # compatibility command.
  - id: gongctl
    ids: [gongctl-compat]
    name_template: "gongctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge "

# Homebrew Cask → tap 저장소(JungHoonGhae/homebrew-opendatactl)에 자동 커밋.
# 필요: tap 저장소 + 쓰기 권한 토큰(HOMEBREW_TAP_GITHUB_TOKEN 시크릿).
homebrew_casks:
  - name: opendatactl
    ids: [opendatactl]
    binaries: [opendatactl, gongctl]
    repository:
      owner: JungHoonGhae
      name: homebrew-opendatactl
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/JungHoonGhae/opendatactl"
    description: "data.go.kr 자연어 탐색부터 활용신청·승인 확인·실제 API 호출까지 잇는 AI 에이전트 워크플로"
    # 미서명 바이너리의 macOS Gatekeeper 격리 제거 (없으면 첫 실행이 차단됨).
    hooks:
      post:
        install: |
          if OS.mac?
            ["opendatactl", "gongctl"].each do |binary|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/#{binary}"]
            end
          end

release:
  draft: false
  prerelease: auto
