# GoReleaser config — odeduck 공식 바이너리용.
# 태그 푸시(vX.Y.Z) 시 GitHub Actions(release.yml)가 실행 → 크로스플랫폼 바이너리 +
# 체크섬 + GitHub Release를 생성한다. 공개 설치는 HTTPS로, private preview는 인증된 gh로 asset을 받는다.
version: 2

project_name: odeduck

before:
  hooks:
    - go mod tidy

builds:
  - id: odeduck
    main: ./cmd/odeduck
    binary: odeduck
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/JungHoonGhae/odeduck/internal/version.CommandName=odeduck
      - -X github.com/JungHoonGhae/odeduck/internal/version.Version={{ .Version }}
      - -X github.com/JungHoonGhae/odeduck/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/JungHoonGhae/odeduck/internal/version.Date={{ .Date }}
archives:
  - id: odeduck
    ids: [odeduck]
    name_template: "odeduck_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./release-assets/odeduck-catalog.json.gz
    - glob: ./release-assets/catalog-source.json
    - glob: ./install.sh
    - glob: ./install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge "

release:
  name_template: "오데덕 (odeduck) v{{ .Version }}"
  draft: false
  prerelease: auto
  preflight:
    fail_on_error: true
  extra_files:
    - glob: ./release-assets/odeduck-catalog.json.gz
    - glob: ./release-assets/catalog-source.json
    - glob: ./install.sh
    - glob: ./install.ps1
